<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Solid, hard-edged offset shadow for a physical, stamped look -->
    <filter id="hard-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="12" stdDeviation="0" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    
    <!-- Smaller solid shadow for inner depth -->
    <filter id="hard-shadow-sm" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="6" stdDeviation="0" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Transparent background so it sits perfectly inside your Header's rounded container -->
  <rect width="400" height="400" fill="transparent" />

  <!-- Outer Casino Chip Base (Deep Purple Secondary) -->
  <circle cx="200" cy="200" r="140" fill="#2b0a8f" stroke="#01140b" stroke-width="8" filter="url(#hard-shadow)" />
  
  <!-- Chip Edge Markings (Hot Pink Accent) -->
  <circle cx="200" cy="200" r="115" fill="none" stroke="#e13af1" stroke-width="24" stroke-dasharray="35 25" />

  <!-- Inner Core (Neon Green Primary) -->
  <circle cx="200" cy="200" r="75" fill="#72f5b1" stroke="#01140b" stroke-width="8" filter="url(#hard-shadow-sm)" />

  <!-- Central Monogram (Dark Background Color for contrast) -->
  <text x="50%" y="53%" font-family="'Atkinson Hyperlegible Mono', monospace, sans-serif" font-size="72" font-weight="900" fill="#01140b" text-anchor="middle" dominant-baseline="middle">RA</text>
</svg>
